name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each check runs even if an earlier one failed, so one push reports every problem at once
      # instead of revealing them one round-trip at a time.
      - name: Typecheck
        if: '!cancelled()'
        run: npx tsc -b

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Unit tests
        if: '!cancelled()'
        run: npm test

      - name: Build
        if: '!cancelled()'
        run: npm run build
